<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #faf6ee;
    color: #2b2118;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    display: grid;
    place-items: center;
  }
  .card { text-align: center; }
  .stamp { height: 120px; transform: rotate(-3deg); }
  h1 { font-size: 112px; font-weight: 600; margin: 36px 0 12px; letter-spacing: -1px; }
  p { font-size: 40px; margin: 0; color: #6b5d50; }
  .strip { display: flex; gap: 28px; justify-content: center; align-items: center; margin-top: 56px; }
  .strip img { height: 30px; }
</style>
</head>
<body>
  <div class="card">
    <img class="stamp" src="../site/badges/stamp/written-by-hand.svg" alt="">
    <h1>Written by Hand</h1>
    <p>A tiny badge for code made the old-fashioned way.</p>
    <div class="strip">
      <img src="../site/badges/classic/written-by-hand.svg" alt="">
      <img src="../site/badges/terminal/written-by-hand.svg" alt="">
      <img src="../site/badges/pixel/written-by-hand.svg" alt="">
      <img src="../site/badges/minimal/written-by-hand.svg" alt="">
      <img src="../site/badges/coffee/written-by-hand.svg" alt="">
    </div>
  </div>
</body>
</html>
